name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # - name: Verify Java installation
      #   run: java -version

      - name: Build with Maven
        working-directory: services/platform/api
        run: ./mvnw verify
