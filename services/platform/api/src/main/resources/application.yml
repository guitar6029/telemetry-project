spring:

  application:
    name: platform-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}

