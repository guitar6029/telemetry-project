<div class="flex flex-row items-center gap-2 rounded-md p-2 bg-neutral-800 relative" (click)="toggleDropdown()">
    <div class="rounded-full bg-blue-500 w-12 h-12"></div>
    <div class="flex flex-col gap-1">
        <span class="font-bold">{{fullName()}}</span>
        <span class="text-sm">{{email()}}</span>
    </div>


    @if (dropdownDisplaying()){
    <div class="absolute h-50 z-999 top-20 w-50 flex flex-col gap-2 border-2 rounded-md bg-neutral-800">

        <button (click)="logout()">Logout</button>
    </div>

    }

</div>
