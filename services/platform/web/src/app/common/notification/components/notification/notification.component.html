<div class="toast toast-top toast-end z-50">
    @if (notification(); as notification) {
    <div
        role="alert"
        class="alert"
        [class.alert-success]="notification.type === 'success'"
        [class.alert-error]="notification.type === 'error'"
        [class.alert-warning]="notification.type === 'warning'"
        [class.alert-info]="notification.type === 'info'"
    >
        @switch (notification.type) {
        @case ('success') {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
        </svg>
        }
        @case ('error') {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
        </svg>
        }
        @case ('warning') {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"
            />
        </svg>
        }
        @default {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M12 21a9 9 0 100-18 9 9 0 000 18z"
            />
        </svg>
        }
        }

        <div class="min-w-0 flex-1">
            <span>{{ notification.message }}</span>

            <div class="mt-2 flex items-center justify-between gap-2">
                <div class="flex items-center gap-1">
                    @if (canPrevious()) {
                    <button
                        type="button"
                        class="btn btn-ghost btn-xs"
                        aria-label="Previous notification"
                        (click)="previous()"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    }

                    <span class="text-xs" aria-live="polite">{{ position() }} / {{ count() }}</span>

                    @if (canNext()) {
                    <button
                        type="button"
                        class="btn btn-ghost btn-xs"
                        aria-label="Next notification"
                        (click)="next()"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    }
                </div>

                <button
                    type="button"
                    class="btn btn-ghost btn-sm"
                    aria-label="Dismiss notification"
                    (click)="dismiss()"
                >
                    ×
                </button>
            </div>
        </div>
    </div>
    }
</div>
