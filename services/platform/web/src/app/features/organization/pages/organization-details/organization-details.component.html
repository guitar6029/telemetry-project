@if (error()) {
<p>{{ error() }}</p>
}

@if (organization(); as org) {
<div>
    <header>
        <h2>{{ org.name }}</h2>
        <p>{{ org.slug }}</p>
    </header>

    <div>
        <p>
            <strong>Organization ID:</strong>
            {{ org.id }}
        </p>

        <p>
            <strong>Created:</strong>
            {{ org.createdAt }}
        </p>

        <p>
            <strong>Updated:</strong>
            {{ org.updatedAt }}
        </p>
    </div>
</div>
}
