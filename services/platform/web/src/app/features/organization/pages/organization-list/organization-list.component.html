@if (error()){
<p>{{ error()}}</p>
} @else if (organizations().length === 0){
<app-empty-state message="No organizations found"></app-empty-state>
}

<table mat-table [dataSource]="organizations()">

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
            Name
        </th>
        <td mat-cell *matCellDef="let organization">
            <a [routerLink]="['/organizations', organization.id]">{{organization.name}}</a>
        </td>
    </ng-container>


    <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>
            Slug
        </th>
        <td mat-cell *matCellDef="let organization">
            {{organization.slug}}
        </td>
    </ng-container>


    <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>
            Created At
        </th>
        <td mat-cell *matCellDef="let organization">
            {{organization.createdAt}}
        </td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef>
            Updated At
        </th>
        <td mat-cell *matCellDef="let organization">
            {{organization.updatedAt}}
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [length]="total()" [pageIndex]="page()" [pageSize]="pageSize()" [pageSizeOptions]="[5,10,25,50]"
    (page)="onPageChange($event)">

</mat-paginator>
