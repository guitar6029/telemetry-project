<telemetry-page>

    @if (error()) {
    <telemetry-error [text]="error() ?? 'Error'" />
    } @else if (organizations().length === 0) {
    <telemetry-button [routerLink]="['/app/organizations/new']" text="New Organization" [icon]="IconName.PLUS" />
    <telemetry-empty-state message="No organizations found"></telemetry-empty-state>
    } @else {
    <telemetry-button [routerLink]="['/app/organizations/new']" text="New Organization" [icon]="IconName.PLUS" />
    <telemetry-table [data]="organizations()" [columns]="organizationColumns" />
    }

    <telemetry-pagination [page]="pagination().page" [size]="pagination().size" [total]="pagination().total"
        [totalPages]="pagination().totalPages" (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)" />


</telemetry-page>
