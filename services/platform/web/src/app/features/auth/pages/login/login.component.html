<form class="form-default" [formGroup]="loginForm" (ngSubmit)="login()" class="w-xs">

    <fieldset class="fieldset">
        <legend class="fieldset-legend fieldset-legend-title">Login</legend>
        <telemetry-label text="Email" />
        <telemetry-input [type]="InputType.EMAIL" [control]="loginForm.controls.email" />
        <telemetry-label text="Password" />
        <telemetry-input [type]="InputType.PASSWORD" [control]="loginForm.controls.password" />
    </fieldset>

    <div class="flex flex-col gap-1">
    </div>

    @if (loginError) {
    <p class="login-error">
        Invalid email or password.
    </p>
    }

    <telemetry-button text="Login" [type]="ButtonType.SUBMIT" [disabled]="loginForm.invalid" />


</form>
