<form [formGroup]="loginForm" (ngSubmit)="login()" class="w-xs">

    <telemetry-input [type]="InputType.EMAIL" [control]="loginForm.controls.email" />

    <telemetry-input [type]="InputType.PASSWORD" [control]="loginForm.controls.password" />

    @if (loginError) {
    <p class="login-error">
        Invalid email or password.
    </p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="loginForm.invalid">
        Login
    </button>
</form>
