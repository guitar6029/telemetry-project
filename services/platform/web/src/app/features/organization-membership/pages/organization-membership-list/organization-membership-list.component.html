<telemetry-page>

    @if (error()) {
    <p>{{ error() }}</p>
    } @else if (users().length === 0) {
    <telemetry-empty-state message="No users found"></telemetry-empty-state>
    } @else {
    <telemetry-button [routerLink]="['/app/manage/invite']" text="Invite" />
    <telemetry-table [data]="users()" [columns]="userColumns" />
    }


</telemetry-page>
